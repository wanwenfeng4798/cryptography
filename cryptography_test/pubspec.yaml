name: cryptography_test
version: 0.1.1
homepage: https://github.com/wanwenfeng4798/cryptography
description: A package for testing and benchmarking cryptographic algorithm implementations that
  implement "package:cryptography_pro" interfaces.

environment:
  sdk: '>=3.11.0 <4.0.0'

# Open-source contributors:
#
# If you add a dependency to the package, please help
# readers of pubspec.yaml to understand who maintains it
# and any other useful information about it.
dependencies:
  #
  # Packages by Google:
  #
  collection: ^1.19.1
  crypto: ^3.0.7
  # Flutter pins test_api; allow its matching test while Dart resolves the latest.
  test: ^1.31.1
  typed_data: ^1.4.0

  #
  # Packages by github.com/wanwenfeng4798:
  #
  cryptography_pro: ^2.9.2

dev_dependencies:
  #
  # Packages by Google:
  #
  lints: ^6.1.0

dependency_overrides:
  cryptography_pro:
    path: ../cryptography_pro
