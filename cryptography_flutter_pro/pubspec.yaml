name: cryptography_flutter_pro
description:
  Makes 'package:cryptography_pro' use platform APIs in Android, iOS, and Mac OS X. The package can
  make performance up to 100 times better.
version: 0.1.1
homepage: https://github.com/wanwenfeng4798/cryptography

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.7'

# Open-source contributors:
#
# If you add a dependency to the package, please help
# readers of pubspec.yaml to understand who maintains it
# and any other useful information about it.
dependencies:
  #
  # Packages by github.com/wanwenfeng4798:
  #
  cryptography_pro: ^2.9.2

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  cryptography_pro:
    path: ../cryptography_pro

flutter:
  config:
    enable-swift-package-manager: true

  plugin:
    platforms:
      android:
        package: dev.dint.cryptography_flutter_pro
        pluginClass: CryptographyFlutterPlugin
        dartPluginClass: FlutterCryptography
      ios:
        sharedDarwinSource: true
        pluginClass: CryptographyFlutterPlugin
        dartPluginClass: FlutterCryptography
      macos:
        sharedDarwinSource: true
        pluginClass: CryptographyFlutterPlugin
        dartPluginClass: FlutterCryptography
